name: Nx Agents Reusable

on:
  workflow_call:
    inputs:
      fetch_depth:
        type: number
        required: false
        default: 0
      lfs:
        type: boolean
        required: false
        default: false
      node_version:
        type: string
        required: false
        default: '24'
      pnpm_version:
        type: string
        required: false
        default: '10'
      use_nx_set_shas:
        type: boolean
        required: false
        default: true
      run_version_check:
        type: boolean
        required: false
        default: false
      nx_branch:
        type: string
        required: true
      distribute_on:
        type: string
        required: false
        default: '3 ci-linux-node24'
      stop_agents_after:
        type: string
        required: true
      nx_commands:
        type: string
        required: true
      setup_pages:
        type: boolean
        required: false
        default: false
      upload_pages_artifact:
        type: boolean
        required: false
        default: false
      upload_pages_artifact_path:
        type: string
        required: false
        default: ''

permissions:
  actions: read
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_CLOUD_CONTINUOUS_ASSIGNMENT: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          lfs: ${{ inputs.lfs }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}

      - name: Use Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app versions are in sync
        if: inputs.run_version_check
        run: pnpm run version:check

      - name: Set Nx SHAs
        if: inputs.use_nx_set_shas
        uses: nrwl/nx-set-shas@v5

      - name: Start Nx Agents run
        run: >
          pnpm exec nx-cloud start-ci-run
          --distribute-on="${{ inputs.distribute_on }}"
          --require-explicit-completion
          --stop-agents-after="${{ inputs.stop_agents_after }}"
        env:
          NX_BRANCH: ${{ inputs.nx_branch }}
          NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run Nx commands
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.nx_commands }}
        env:
          NX_BRANCH: ${{ inputs.nx_branch }}
          NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Pages
        if: inputs.setup_pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: inputs.upload_pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.upload_pages_artifact_path }}

      - name: Complete Nx Agents run
        if: always()
        run: pnpm exec nx-cloud complete-ci-run
        env:
          NX_BRANCH: ${{ inputs.nx_branch }}
          NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}
