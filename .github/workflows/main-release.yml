name: Main Release

# Build and publish release artifacts when changes land on main.
on:
  push:
    branches: [ main ]

jobs:
  # Coordinator-only release checks: version sync, version discovery, and tag collision guard.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app versions are in sync
        run: pnpm run version:check

      - name: Read release version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fail if release tag already exists
        shell: bash
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists."
            exit 1
          fi

  # Linux web release path: build the GitHub Pages artifact and deploy it.
  github_pages:
    needs: prepare
    uses: ./.github/workflows/nx-ci-runner.yml
    secrets: inherit
    permissions:
      pages: write
      id-token: write
    with:
      fetch_depth: 50
      lfs: true
      use_nx_set_shas: false
      nx_branch: ${{ github.ref_name }}
      stop_agents_after: build
      nx_commands: pnpm run build-gh-pages
      setup_pages: true
      upload_pages_artifact: true
      upload_pages_artifact_path: dist/apps/client

  # Windows release path: keep Tauri packaging local because it depends on Windows tooling.
  tauri_release:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/client/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app versions are in sync
        run: pnpm run version:check

      - name: Build web client for Tauri
        run: pnpm nx build client --configuration=tauri

      # The action creates the GitHub release and uploads the NSIS installer assets.
      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/client
          tagName: v__VERSION__
          releaseName: Ashes of the Ancients v__VERSION__
          releaseBody: Desktop release for Ashes of the Ancients v__VERSION__.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

  deploy:
    needs: github_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
