name: AI Regression Pack

on:
  # push:
  #   tags: ["ai-regression/**"]
  workflow_dispatch:
    inputs:
      profile:
        description: Regression coverage
        type: choice
        options: [core, scout]
        default: core
      run_ai_regression:
        description: Run the bounded single-player native AI regression pack
        type: boolean
        required: true
        default: false

env:
  AI_REGRESSION_PROFILE: ${{ inputs.profile || (startsWith(github.ref, 'refs/tags/ai-regression/scout/') && 'scout' || 'core') }}

permissions:
  contents: read

jobs:
  plan:
    if: ${{ github.event_name == 'push' || inputs.run_ai_regression }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the shared AI regression pack
        id: select
        run: node tools/ai/select-ai-regression-shards.mjs

  run:
    if: ${{ github.event_name == 'push' || inputs.run_ai_regression }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RUN_AI_REGRESSION: ${{ github.event_name == 'push' || inputs.run_ai_regression }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.14.0
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run selected AI regression case
        run: pnpm ai:regression -- --case "${{ matrix.caseId }}"
      - name: Retain AI regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-regression-${{ matrix.id }}-${{ github.run_id }}
          path: |
            tmp/ai-skirmish-matrix/*.json
            tmp/ai-skirmish-matrix/*.json.variants/**
            tmp/ai-skirmish-matrix/indexes/*.json
            tmp/ai-skirmish-regression/latest.json
            test-results/
          if-no-files-found: warn

  skipped:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_ai_regression }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the extended pack was disabled
        run: echo "RUN_AI_REGRESSION=false; no runtime cases selected"
