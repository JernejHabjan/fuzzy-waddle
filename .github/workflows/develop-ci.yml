name: Develop CI

on:
  push:
    branches: [develop]

permissions:
  actions: read
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    # This job validates code but does not publish its build output, so it can retain LFS pointers.
    env:
      FUZZY_WADDLE_ALLOW_LFS_POINTERS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.14.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check skirmish test catalog
        run: pnpm ai:skirmish:catalog

      - name: Derive affected project SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: develop

      # Keep CI on a single GitHub runner for this repo. Recent Nx Agents trials did
      # not improve end-to-end time because the expensive work is concentrated in a
      # small number of large frontend targets rather than many independent projects.
      - name: Run linter
        run: pnpm nx affected -t lint
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # If the workspace structure changes and affected work becomes broadly
      # parallelizable, re-evaluate Nx Agents before adding the extra CI complexity.
      - name: Run tests
        run: pnpm nx affected -t test --configuration=ci
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Build Packages
        run: pnpm nx affected -t build --configuration=production
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # - name: Setup Pages
      #   uses: actions/configure-pages@v5
      #
      # - name: Upload artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     # Upload dist/apps/portal
      #     path: 'dist/apps/portal'

  ai-regression-plan:
    if: vars.RUN_AI_REGRESSION == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the shared AI regression pack
        id: select
        run: node tools/ai/select-ai-regression-shards.mjs

  ai-regression:
    if: vars.RUN_AI_REGRESSION == 'true'
    needs: ai-regression-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_AI_REGRESSION: ${{ vars.RUN_AI_REGRESSION }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.ai-regression-plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.14.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run selected AI regression case
        run: pnpm ai:regression -- --case "${{ matrix.caseId }}"
      - name: Retain AI regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-regression-${{ matrix.id }}-${{ github.run_id }}
          path: |
            tmp/ai-skirmish-matrix/*.json
            tmp/ai-skirmish-matrix/*.json.variants/**
            tmp/ai-skirmish-matrix/indexes/*.json
            tmp/ai-skirmish-regression/latest.json
            test-results/
          if-no-files-found: warn

