name: Develop CI

# Validate and publish the develop branch preview build.
on:
  push:
    branches: [ develop ]

jobs:
  # Run affected validation on develop pushes, then build the GitHub Pages client artifact.
  build:
    uses: ./.github/workflows/nx-ci-runner.yml
    secrets: inherit
    with:
      nx_branch: ${{ github.ref_name }}
      stop_agents_after: lint,test,build
      nx_commands: |
        pnpm exec nx affected -t lint,test
        pnpm run build-gh-pages

