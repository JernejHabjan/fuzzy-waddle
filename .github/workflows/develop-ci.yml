name: Develop CI

# Validate and publish the develop branch preview build.
on:
  push:
    branches: [ develop ]

# Required by nx-set-shas when it resolves the commit range for affected runs.
permissions:
  actions: read
  contents: read

# Shared Nx Cloud configuration for the jobs in this workflow.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_CLOUD_CONTINUOUS_ASSIGNMENT: true

jobs:
  # Run affected validation on develop pushes, then build the GitHub Pages client artifact.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Populate NX_BASE / NX_HEAD so `nx affected` uses the previous successful range on develop.
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      # Start the Nx Cloud coordinator before running distributed tasks.
      - name: Start Nx Agents run
        run: >
          pnpm exec nx-cloud start-ci-run
          --distribute-on="3 ci-linux-node24"
          --require-explicit-completion
          --stop-agents-after="lint,test,build"
        env:
          NX_BRANCH: ${{ github.ref_name }}
          # `github.run_id` is reused on Actions reruns, so include the attempt to avoid
          # reopening an Nx Cloud run group that was already completed by a prior attempt.
          NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}

      # Validate only the projects affected by the develop push.
      - name: Run distributed workspace checks
        run: pnpm exec nx affected -t lint,test
        env:
          NX_BRANCH: ${{ github.ref_name }}
          NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}

      # Keep the existing preview build behavior local to the coordinator job.
      - name: Build Packages
        run: pnpm run build-gh-pages
        env:
          NX_BRANCH: ${{ github.ref_name }}
          NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}

      # Always close the CI run so idle agents do not linger after success or failure.
      - name: Complete Nx Agents run
        if: always()
        run: pnpm exec nx-cloud complete-ci-run
        env:
          NX_BRANCH: ${{ github.ref_name }}
          NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}

      # - name: Setup Pages
