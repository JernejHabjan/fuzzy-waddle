name: Develop CI

on:
  push:
    branches: [ develop ]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: false
        #   fetch-depth: 50

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Keep CI on a single GitHub runner for this repo. Recent Nx Agents trials did
      # not improve end-to-end time because the expensive work is concentrated in a
      # small number of large frontend targets rather than many independent projects.
      - name: Run linter
        run: pnpm run lint
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # If the workspace structure changes and affected work becomes broadly
      # parallelizable, re-evaluate Nx Agents before adding the extra CI complexity.
      - name: Run tests
        run: pnpm run test:ci
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Build Packages
        run: pnpm run build-gh-pages
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # - name: Setup Pages
      #   uses: actions/configure-pages@v5
