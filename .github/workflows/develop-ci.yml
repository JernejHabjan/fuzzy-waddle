name: Develop CI

on:
  push:
    branches: [ develop ]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
        #   fetch-depth: 50

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Keep CI on a single GitHub runner for this repo. Recent Nx Agents trials did
      # not improve end-to-end time because the expensive work is concentrated in a
      # small number of large client targets rather than many independent projects.
      - name: Run linter
        run: pnpm run lint
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # If the workspace structure changes and affected work becomes broadly
      # parallelizable, re-evaluate Nx Agents before adding the extra CI complexity.
      - name: Run tests
        run: pnpm run test
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Build Packages
        run: pnpm run build-gh-pages
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # - name: Setup Pages
      #   uses: actions/configure-pages@v5
