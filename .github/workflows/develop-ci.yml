name: Develop CI

on:
  push:
    branches: [ develop ]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_CLOUD_CONTINUOUS_ASSIGNMENT: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
        #   fetch-depth: 50

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Nx Agents run
        run: >
          pnpm exec nx-cloud start-ci-run
          --distribute-on="3 ci-linux-node24"
          --require-explicit-completion
          --stop-agents-after="lint,test,build"
        env:
          NX_BRANCH: ${{ github.ref_name }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Run distributed workspace checks
        run: pnpm exec nx run-many -t lint,test --all
        env:
          NX_BRANCH: ${{ github.ref_name }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Build Packages
        run: pnpm run build-gh-pages
        env:
          NX_BRANCH: ${{ github.ref_name }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Complete Nx Agents run
        if: always()
        run: pnpm exec nx-cloud complete-ci-run
        env:
          NX_BRANCH: ${{ github.ref_name }}
          NX_RUN_GROUP: ${{ github.run_id }}

