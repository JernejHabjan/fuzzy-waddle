name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  actions: read
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  version:
    if: github.event.pull_request.draft == false && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.14.0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Verify package version changed from main
        run: node tools/ci/check-version.mjs pr-bump
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Verify app versions are in sync
        run: pnpm run version:check

  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # This job validates code but does not publish its build output, so it can retain LFS pointers.
    env:
      FUZZY_WADDLE_ALLOW_LFS_POINTERS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.14.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive affected project SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: develop

      - name: Verify app versions are in sync
        run: pnpm run version:check

      # Keep PR validation local to one runner. Nx Agents currently add coordination
      # overhead here without speeding up this repo's mostly frontend-heavy workload.
      - name: Run linter
        run: pnpm nx affected -t lint
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # Revisit distributed CI only after the expensive targets are split into more
      # independent units that Nx can actually schedule across multiple machines.
      - name: Run tests
        run: pnpm nx affected -t test --configuration=ci
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Install Playwright Chromium
        if: github.base_ref == 'main'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: github.base_ref == 'main'
        run: pnpm nx affected -t e2e
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Test build
        run: pnpm nx affected -t build --configuration=production
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}
