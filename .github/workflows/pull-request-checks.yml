name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  actions: read
  contents: read

env:
  AI_REGRESSION_PROFILE: ${{ vars.AI_REGRESSION_PROFILE || 'core' }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  version:
    if: github.event.pull_request.draft == false && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.14.0

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Verify package version changed from main
        run: node tools/ci/check-version.mjs pr-bump
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Verify app versions are in sync
        run: pnpm run version:check

  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # This job validates code but does not publish its build output, so it can retain LFS pointers.
    env:
      FUZZY_WADDLE_ALLOW_LFS_POINTERS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.14.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check skirmish test catalog
        run: pnpm ai:skirmish:catalog

      - name: Derive affected project SHAs
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: develop

      - name: Verify app versions are in sync
        run: pnpm run version:check

      # Keep PR validation local to one runner. Nx Agents currently add coordination
      # overhead here without speeding up this repo's mostly frontend-heavy workload.
      - name: Run linter
        run: pnpm nx affected -t lint
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      # Revisit distributed CI only after the expensive targets are split into more
      # independent units that Nx can actually schedule across multiple machines.
      - name: Run tests
        run: pnpm nx affected -t test --configuration=ci
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Run AI tooling tests and typecheck
        if: github.base_ref == 'main'
        run: pnpm tools:test && pnpm ai:tools:typecheck

      - name: Install Playwright Chromium
        if: github.base_ref == 'main'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: github.base_ref == 'main'
        run: pnpm nx affected -t e2e
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

      - name: Test build
        run: pnpm nx affected -t build --configuration=production
        env:
          NX_BRANCH: ${{ github.event.number }}
          NX_RUN_GROUP: ${{ github.run_id }}

  e2e-ai-plan:
    name: E2E AI Plan
    if: github.event.pull_request.draft == false && github.base_ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Select e2e:ai cases from manifest
        id: select
        run: node tools/probable-waffle/skirmish/ai/cli/select-ai-regression-shards.ts

  e2e-ai:
    name: E2E AI (${{ matrix.id }})
    if: github.event.pull_request.draft == false && github.base_ref == 'main'
    needs: e2e-ai-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.e2e-ai-plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.14.0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e:ai case
        run: pnpm ai:skirmish:regression -- --case "${{ matrix.caseId }}"
        env:
          AI_SKIRMISH_MATRIX_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ai-${{ matrix.id }}-${{ github.run_id }}
          path: |
            tmp/ai-skirmish-matrix/*.json
            tmp/ai-skirmish-matrix/*.json.variants/**
            tmp/ai-skirmish-matrix/indexes/*.json
            tmp/ai-skirmish-regression/latest.json
            test-results/
          if-no-files-found: warn
