name: Pull Request Checks

# Run validation on non-draft PR activity for the long-lived branches.
on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

jobs:
  # Keep version policy separate from distributed Nx work. This only runs for PRs into main.
  version:
    if: github.event.pull_request.draft == false && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Verify package version changed from main
        run: node tools/ci/check-version.mjs pr-bump
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Verify app versions are in sync
        run: pnpm run version:check

  # Main PR validation path: compute affected scope, distribute Nx tasks, then close the agent run.
  build:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/nx-ci-runner.yml
    secrets: inherit
    with:
      run_version_check: true
      nx_branch: ${{ github.event.number }}
      stop_agents_after: lint,test,build
      nx_commands: pnpm exec nx affected -t lint,test,build
